name: Security Analysis

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    - cron: "41 3 * * *" # Daily at 03:41 UTC

jobs:
  image:
    name: Image Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Name the published image
        run: echo "IMAGE_REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >>"${GITHUB_ENV}"
      # The same derivation publish-image.yaml uses, so the scan names the tag that
      # workflow actually pushed rather than a number in a file that can drift.
      - id: read_tag
        run: |
          base="$(sed -n 's|^FROM debian:\([a-z0-9.]*\)@.*|debian-\1|p' Dockerfile | head -n 1)"
          case "${base}" in
            debian-?*) ;;
            *) echo "::error::could not read the Debian tag from the Dockerfile"; exit 1 ;;
          esac
          echo "tag=${base}" >>"${GITHUB_OUTPUT}"
      - name: Run docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Five repositories build their releases with this toolchain, so a CVE here is a
      # supply-chain problem for all of them at once.
      - name: Scan the published image
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ steps.read_tag.outputs.tag }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}:/out" \
            aquasec/trivy:latest image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format sarif \
              --output /out/trivy.sarif \
              "${IMAGE}"
      - name: Run github/codeql-action/upload-sarif
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-dev-base

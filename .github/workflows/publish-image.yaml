name: Publish Docker Image

# The tag names the Debian the image is built on, read out of the Dockerfile, so a base
# bump renames the tag and a script change moves the digest under the same one.
on:
  push:
    branches:
      - "main"
    paths:
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/publish-image.yaml"
  pull_request:
    branches:
      - "main"
    paths:
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/publish-image.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-push:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # main rather than the triggering commit: two pushes landing together are serialised
      # by the concurrency group, and the second has to read the id the first just wrote.
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the tag after the base image
        run: |
          base="$(sed -n 's|^FROM debian:\([a-z0-9.]*\)@.*|debian-\1|p' Dockerfile | head -n 1)"
          case "${base}" in
            debian-?*) ;;
            *) echo "::error::could not read the Debian tag from the Dockerfile"; exit 1 ;;
          esac
          echo "VERSION=${base}" >>"${GITHUB_ENV}"
      - name: Record the commit being built
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >>"${GITHUB_ENV}"
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Run docker/login-action
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # A pull request builds and stops there, so a broken Dockerfile fails before merge.
      - name: Name the published image
        run: echo "IMAGE=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >>"${GITHUB_ENV}"
      - name: Run docker/build-push-action
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
